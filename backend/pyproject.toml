[project]
name = "worldsim"
version = "0.1.0"
description = "Deterministic autonomous fantasy world kernel (Stage 0 bootstrap)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.14",
  "httpx>=0.27",
  "fastapi>=0.141.1",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "basedpyright>=1.20",
  "pre-commit>=4.0",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF100"]
