# Alembic configuration (owned by S0-DB-001). The URL is overridden from
# validated settings in migrations/env.py; this value is a local fallback.
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url = postgresql+asyncpg://worldsim:changeme-local-only@localhost:5432/worldsim

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
