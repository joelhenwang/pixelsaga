services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldsim}
      POSTGRES_USER: ${POSTGRES_USER:-worldsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-worldsim} -d $${POSTGRES_DB:-worldsim}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
