services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldsim}
      POSTGRES_USER: ${POSTGRES_USER:-worldsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-worldsim} -d $${POSTGRES_DB:-worldsim}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      WORLDSIM_APP__HOST: "0.0.0.0"
      WORLDSIM_APP__PORT: "8000"
      WORLDSIM_DATABASE__URL: "postgresql+asyncpg://worldsim:${POSTGRES_PASSWORD:-changeme-local-only}@db:5432/${POSTGRES_DB:-worldsim}"
      WORLDSIM_SECURITY__PUBLIC_BIND_ALLOW: "${WORLDSIM_SECURITY__PUBLIC_BIND_ALLOW:-false}"
      WORLDSIM_SECURITY__API_KEY: "${WORLDSIM_SECURITY__API_KEY:-}"
    ports:
      - "${API_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
